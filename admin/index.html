<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Yönetim | Taha Efe Karabacak</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../blog/blog.css">
    <script src="../blog/blog.js"></script>
    <style>
        .wrap { max-width: 980px; }
        .tabs { display: flex; flex-wrap: wrap; gap: 4px 22px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
        .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 2px; font: 600 14px Inter, sans-serif; color: var(--muted); cursor: pointer; }
        .tabs button.on { color: var(--heading); border-bottom-color: var(--accent); }
        .tb { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        .tb button { min-width: 44px; min-height: 44px; padding: 0 12px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: 600 13px Inter, sans-serif; cursor: pointer; }
        .tb button:hover { border-color: var(--accent); color: var(--accent); }
        .split { display: flex; gap: 24px; align-items: flex-start; }
        .split > div { flex: 1; min-width: 0; }
        .pv { border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; background: var(--bg); }
        .pv small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
        .row2 { display: flex; align-items: center; gap: 8px; }
        .row2 input { flex: 1; }
        details summary { cursor: pointer; font-weight: 600; padding: 12px 0; color: var(--heading); }
        ul.items { list-style: none; margin: 0; padding: 0; }
        ul.items li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
        ul.items .n { flex: 1; min-width: 0; } ul.items .n b { color: var(--heading); display: block; } ul.items .n span { color: var(--muted); font-size: .88em; }
        ul.items .btn { margin: 0; padding: 8px 12px; font-size: .8em; }
        @media (max-width: 760px) { .split { flex-direction: column; } ul.items li { flex-wrap: wrap; } }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="site">
            <span class="name">Blog Yönetimi</span>
            <nav><a href="../blog/">Blogu gör</a><button class="tbtn" id="theme-btn" type="button"></button></nav>
        </header>

        <details class="panel" id="conn" open>
            <summary>GitHub bağlantısı</summary>
            <div class="grid2">
                <div><label>GitHub kullanıcı adı</label><input id="f-o" autocomplete="off"></div>
                <div><label>Depo (repo) adı</label><input id="f-r" autocomplete="off"></div>
                <div><label>Dal (branch)</label><input id="f-b" autocomplete="off"></div>
                <div><label>Erişim anahtarı (token)</label><input id="f-t" type="password" autocomplete="off" placeholder="github_pat_..."></div>
            </div>
            <button class="btn" type="button" onclick="connect()">Bağlan ve yükle</button>
            <p class="hint">Anahtar yalnızca bu tarayıcıda saklanır. Bu sayfayı herkes açabilir ama anahtar olmadan hiçbir şeyi değiştiremez.</p>
        </details>
        <div id="status"></div>

        <div id="app" style="display:none">
            <div class="tabs" id="tabs"></div>
            <div class="panel"><h2 id="lt">Liste</h2><ul class="items" id="items"></ul></div>
            <div class="panel">
                <h2 id="ft">Yeni kayıt</h2>
                <div class="split" id="split"><div id="form"></div><div id="pvcol" style="display:none"><div class="pv"><small>Önizleme</small><div class="post" id="pv"></div></div></div></div>
                <button class="btn" type="button" onclick="saveItem()">Kaydet ve yayımla</button>
                <button class="btn ghost" type="button" onclick="saveDraft()">Taslak olarak sakla</button>
                <button class="btn ghost" type="button" onclick="newItem()">Formu temizle</button>
            </div>
        </div>
    </div>
    <datalist id="logos"></datalist>

    <script>
        BLOG.initTheme();
        const $ = id => document.getElementById(id), esc = BLOG.esc;
        const KEYS = ['o', 'r', 'b', 't'];
        let S = { o: 'thalesing', r: 'tahaefe', b: 'main', t: '' };
        try { Object.assign(S, JSON.parse(localStorage.getItem('admin-cfg') || '{}')); } catch (e) {}
        KEYS.forEach(k => $('f-' + k).value = S[k]);
        $('logos').innerHTML = 'python pyqt5 javascript typescript react vite html5 css3 proteus jarvis finance tekuni portfolio kbu lise btk hackerrank efset ddd google'.split(' ').map(n => '<option value="' + n + '">').join('');

        // Her sekme: dosya yolu ve form alanları (t: tür)
        const T = {
            posts: { name: 'Yazılar', p: 'blog/posts.json', label: 'title', sub: 'date', move: false, top: false,
                f: [{ k: 'title', l: 'Başlık' }, { k: 'slug', l: 'Adres (boşsa başlıktan üretilir)' }, { k: 'date', l: 'Tarih', t: 'date' }, { k: 'summary', l: 'Kısa özet (listede görünür)' }, { k: 'tags', l: 'Etiketler (virgülle ayır)', t: 'tags' }, { k: 'body', l: 'Metin', t: 'md' }] },
            certs: { name: 'Sertifikalar', p: 'blog/certs.json', label: 't', sub: 'o', move: true, top: true,
                f: [{ k: 't', l: 'Sertifika adı' }, { k: 'o', l: 'Veren kurum' }, { k: 'd', l: 'Tarih (örn. 7 Ekim 2026)' }, { k: 'l', l: 'Logo adı', t: 'logo' }, { k: 'img', l: 'Sertifika görseli', t: 'img', dir: 'sertifikalar' }, { k: 'u', l: 'Doğrulama bağlantısı (isteğe bağlı)' }, { k: 'x', l: 'Ne işe yarar?', t: 'area' }] },
            timeline: { name: 'Zaman çizelgesi', p: 'blog/timeline.json', label: 't', sub: 'd', move: true, top: true,
                f: [{ k: 'd', l: 'Tarih (örn. 2025’ten itibaren)' }, { k: 't', l: 'Başlık' }, { k: 's', l: 'Alt başlık' }, { k: 'l', l: 'Logo adı', t: 'logo' }, { k: 'x', l: 'Açıklama', t: 'area' }, { k: 'k', l: 'İç kartlar (her satır: Başlık | Tarih)', t: 'kids' }] },
            projects: { name: 'Projeler', p: 'blog/projects.json', label: 'name', sub: 'date', move: true, top: false,
                f: [{ k: 'name', l: 'Proje adı' }, { k: 'date', l: 'Tarih' }, { k: 'desc', l: 'Açıklama', t: 'area' }, { k: 'tags', l: 'Etiketler (virgülle ayır)', t: 'tags' }, { k: 'l', l: 'Logo adı', t: 'logo' }, { k: 'url', l: 'Bağlantı (yoksa boş bırak)' }] }
        };
        const REQ = { posts: ['title', 'body'], certs: ['t'], timeline: ['t'], projects: ['name'] };
        let data = {}, sha = {}, cur = 'posts', ed = -1; const PREV = {};

        function status(m, c) { const s = $('status'); s.textContent = m; s.className = c || ''; }
        const slugify = t => t.toLowerCase().replace(/[çğıöşüİ]/g, c => ({ 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'İ': 'i' })[c]).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        const enc = s => btoa(unescape(encodeURIComponent(s))), dec = b => decodeURIComponent(escape(atob(b.replace(/\n/g, ''))));
        const today = () => new Date().toISOString().slice(0, 10);

        function api(path, method, body) {
            let u = 'https://api.github.com/repos/' + S.o + '/' + S.r + '/contents/' + path;
            if (method === 'GET') u += '?ref=' + encodeURIComponent(S.b) + '&_=' + Date.now();
            const h = { Authorization: 'Bearer ' + S.t, Accept: 'application/vnd.github+json' }; if (body) h['Content-Type'] = 'application/json';
            return fetch(u, { method, headers: h, body: body ? JSON.stringify(body) : undefined })
                .then(r => r.json().then(j => { if (!r.ok) { const e = new Error(j.message || r.status); e.code = r.status; throw e; } return j; }));
        }
        const load = k => api(T[k].p, 'GET').then(j => { sha[k] = j.sha; data[k] = JSON.parse(dec(j.content)); })
            .catch(e => { if (e.code === 404) { sha[k] = ''; data[k] = []; missing.push(T[k].name); } else throw e; });
        let missing = [];

        function connect() {
            KEYS.forEach(k => S[k] = $('f-' + k).value.trim());
            try { localStorage.setItem('admin-cfg', JSON.stringify(S)); } catch (e) {}
            if (!S.o || !S.r || !S.t) return status('Kullanıcı adı, depo adı ve anahtar gerekli.', 'err');
            status('Bağlanılıyor...'); missing = [];
            Promise.all(Object.keys(T).map(load)).then(() => {
                $('app').style.display = 'block'; $('conn').open = false; tab(cur);
                status(missing.length ? 'Bağlandı. Şu liste dosyaları depoda yok: ' + missing.join(', ') + '. Paketteki .json dosyalarını yükle, yoksa liste boş başlar.' : 'Bağlandı.', missing.length ? 'err' : 'ok');
            }).catch(e => status('Bağlanılamadı: ' + e.message, 'err'));
        }

        function commit(k, next, msg) {
            status('Yayımlanıyor...');
            const b = { message: msg, content: enc(JSON.stringify(next, null, 2)), branch: S.b }; if (sha[k]) b.sha = sha[k];
            return api(T[k].p, 'PUT', b).then(j => { sha[k] = j.content.sha; data[k] = next; status('Kaydedildi. Canlı sitede yaklaşık 1 dakika içinde görünür.', 'ok'); return true; })
                .catch(e => { status('Kaydedilemedi: ' + e.message, 'err'); return false; });
        }

        function tab(k) {
            cur = k; ed = -1;
            $('tabs').innerHTML = Object.keys(T).map(x => '<button type="button" class="' + (x === k ? 'on' : '') + '" onclick="tab(\'' + x + '\')">' + T[x].name + '</button>').join('');
            $('lt').textContent = T[k].name; list(); form();
        }

        function list() {
            const t = T[cur], arr = data[cur] || [];
            const rows = arr.map((it, i) => ({ it, i })); if (cur === 'posts') rows.sort((a, b) => (b.it.date || '').localeCompare(a.it.date || ''));
            $('items').innerHTML = rows.length ? rows.map(({ it, i }) => '<li><div class="n"><b>' + esc(it[t.label] || '(adsız)') + '</b><span>' + esc(it[t.sub] || '') + '</span></div>' +
                (t.move ? '<button class="btn ghost" type="button" onclick="mv(' + i + ',-1)" aria-label="Yukarı">↑</button><button class="btn ghost" type="button" onclick="mv(' + i + ',1)" aria-label="Aşağı">↓</button>' : '') +
                '<button class="btn ghost" type="button" onclick="edit(' + i + ')">Düzenle</button><button class="btn danger" type="button" onclick="del(' + i + ')">Sil</button></li>').join('') : '<li>Henüz kayıt yok.</li>';
        }

        function form() {
            const t = T[cur];
            $('form').innerHTML = t.f.map(f => {
                const id = 'v-' + f.k, L = '<label for="' + id + '">' + f.l + '</label>';
                if (f.t === 'md') return L + '<div class="tb">' + [['bold', 'Kalın'], ['head', 'Başlık'], ['list', 'Liste'], ['link', 'Bağlantı'], ['img', 'Resim'], ['code', 'Kod']].map(a => '<button type="button" onclick="act(\'' + a[0] + '\')">' + a[1] + '</button>').join('') + '</div><textarea id="' + id + '" oninput="pv()"></textarea>' +
                    '<p class="hint">Alt başlık için satırı <code>## </code>, liste için <code>- </code> ile başlat. Paragraflar arasında boş satır bırak.</p>';
                if (f.t === 'area' || f.t === 'kids') return L + '<textarea id="' + id + '" style="min-height:90px;font-family:inherit"></textarea>';
                if (f.t === 'img') return L + '<div class="row2"><input id="' + id + '"><button type="button" class="btn ghost" style="margin:0" onclick="pickImg(\'' + id + '\',\'' + f.dir + '\')">Yükle</button></div>';
                return L + '<input id="' + id + '"' + (f.t === 'date' ? ' type="date"' : '') + (f.t === 'logo' ? ' list="logos"' : '') + (f.k === 'title' ? ' oninput="pv()"' : '') + (f.t === 'tags' || f.t === 'date' ? ' oninput="pv()"' : '') + '>';
            }).join('');
            $('ft').textContent = (ed > -1 ? 'Düzenle' : 'Yeni') + ' · ' + t.name;
            $('pvcol').style.display = cur === 'posts' ? 'block' : 'none';
            if (cur === 'posts' && ed < 0) $('v-date').value = today();
            pv();
        }

        function get() {
            const o = {};
            T[cur].f.forEach(f => {
                const v = $('v-' + f.k).value;
                if (f.t === 'tags') o[f.k] = v.split(',').map(x => x.trim()).filter(Boolean);
                else if (f.t === 'kids') { const k = v.split('\n').map(l => l.split('|')).filter(p => p[0].trim()).map(p => ({ t: p[0].trim(), d: (p[1] || '').trim() })); if (k.length) o[f.k] = k; }
                else o[f.k] = f.t === 'md' ? v.replace(/\r/g, '').trim() : v.trim();
            });
            return o;
        }
        function put(it) {
            T[cur].f.forEach(f => {
                const v = it[f.k];
                $('v-' + f.k).value = f.t === 'tags' ? (v || []).join(', ') : f.t === 'kids' ? (v || []).map(k => k.t + ' | ' + (k.d || '')).join('\n') : (v || '');
            });
            pv();
        }

        function pv() {
            if (cur !== 'posts') return;
            const o = get(); BLOG.renderPost($('pv'), { title: o.title || 'Başlık', date: o.date || '', tags: o.tags, body: o.body || '…' });
            $('pv').querySelectorAll('img').forEach(i => { const s = i.getAttribute('src'); if (PREV[s]) i.src = PREV[s]; else if (!/^(https?:|data:|\/)/.test(s)) i.src = '../blog/' + s; });
        }

        function newItem() { ed = -1; form(); const d = localStorage.getItem('admin-draft-' + cur); if (d) { try { put(JSON.parse(d)); status('Kayıtlı taslak yüklendi.', 'ok'); } catch (e) {} } }
        function edit(i) { ed = i; form(); put(data[cur][i]); $('ft').scrollIntoView({ behavior: 'smooth' }); }
        function saveDraft() { try { localStorage.setItem('admin-draft-' + cur, JSON.stringify(get())); status('Taslak bu tarayıcıya kaydedildi.', 'ok'); } catch (e) { status('Taslak kaydedilemedi.', 'err'); } }

        function saveItem() {
            const o = get(), miss = REQ[cur].filter(k => !o[k]); if (miss.length) return status('Şunlar gerekli: ' + miss.join(', '), 'err');
            if (cur === 'posts') { o.slug = slugify(o.slug || o.title); o.date = o.date || today(); if (!o.slug) return status('Geçerli bir adres üretilemedi.', 'err'); if (data.posts.some((p, i) => p.slug === o.slug && i !== ed)) return status('Bu adresle başka bir yazı var.', 'err'); }
            const next = data[cur].slice(); if (ed > -1) next[ed] = o; else if (T[cur].top) next.unshift(o); else next.push(o);
            commit(cur, next, 'Blog: ' + (ed > -1 ? 'güncelle' : 'ekle') + ' ' + T[cur].name.toLowerCase()).then(ok => { if (ok) { try { localStorage.removeItem('admin-draft-' + cur); } catch (e) {} ed = -1; list(); form(); } });
        }
        function del(i) { if (!confirm('Silinsin mi?')) return; commit(cur, data[cur].filter((_, k) => k !== i), 'Blog: sil ' + T[cur].name.toLowerCase()).then(ok => { if (ok) { ed = -1; list(); form(); } }); }
        function mv(i, d) { const j = i + d, a = data[cur].slice(); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; commit(cur, a, 'Blog: sırala ' + T[cur].name.toLowerCase()).then(ok => ok && list()); }

        // ---- Görsel yükleme (1400 px'e küçültür) ----
        function upImg(file, dir) {
            return new Promise((res, rej) => {
                const im = new Image(), u = URL.createObjectURL(file);
                im.onload = () => { const k = Math.min(1, 1400 / im.width), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .86)); };
                im.onerror = () => rej(new Error('Görsel okunamadı')); im.src = u;
            }).then(url => { const name = Date.now().toString(36) + '-' + (slugify(file.name.replace(/\.[^.]+$/, '')) || 'gorsel') + '.jpg', path = dir + '/' + name;
                status('Görsel yükleniyor...');
                return api('blog/' + path, 'PUT', { message: 'Blog: görsel ' + name, content: url.split(',')[1], branch: S.b }).then(() => { PREV[path] = url; status('Görsel yüklendi.', 'ok'); return path; }); });
        }
        function pick(cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => i.files[0] && cb(i.files[0]); i.click(); }
        function pickImg(id, dir) { pick(f => upImg(f, dir).then(p => { $(id).value = p; }).catch(e => status('Yüklenemedi: ' + e.message, 'err'))); }

        // ---- Editör düğmeleri ----
        function act(a) {
            const t = $('v-body'), s = t.selectionStart, e = t.selectionEnd, sel = t.value.slice(s, e);
            const wrap = (p, q, ph) => { t.setRangeText(p + (sel || ph) + q, s, e, 'select'); };
            const ls = t.value.lastIndexOf('\n', s - 1) + 1;
            if (a === 'bold') wrap('**', '**', 'kalın metin');
            else if (a === 'head') t.setRangeText('## ', ls, ls, 'end');
            else if (a === 'list') t.setRangeText('- ', ls, ls, 'end');
            else if (a === 'link') { const u = prompt('Bağlantı adresi (https://...)'); if (u) wrap('[', '](' + u + ')', 'bağlantı metni'); }
            else if (a === 'code') { if (sel.includes('\n')) wrap('```\n', '\n```', 'kod'); else wrap('`', '`', 'kod'); }
            else if (a === 'img') { pick(f => upImg(f, 'images').then(p => { const alt = prompt('Resim açıklaması (isteğe bağlı)') || ''; t.setRangeText('\n\n![' + alt + '](' + p + ')\n\n', e, e, 'end'); pv(); }).catch(er => status('Yüklenemedi: ' + er.message, 'err'))); return; }
            t.focus(); pv();
        }
    </script>
</body>
</html>
